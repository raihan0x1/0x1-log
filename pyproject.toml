[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "0x1-log"
version = "1.3.1"
description = "0x1LOG: Embedded observability for FastAPI: searchable logs, error tracking, alerts, metrics, and tracing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Raihan Hidayatullah Djunaedi", email = "raihanhd.dev@gmail.com"},
]
keywords = ["fastapi", "logging", "observability", "monitoring", "error-tracking", "tracing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100",
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/raihan0x1/0x1-log"
Documentation = "https://github.com/raihan0x1/0x1-log#readme"
Repository = "https://github.com/raihan0x1/0x1-log"
Issues = "https://github.com/raihan0x1/0x1-log/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "uvicorn>=0.24.0",
    "httpx2>=2.0.0",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
postgres = [
    "psycopg[binary]>=3.0",
]
redis = [
    "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ox1log*"]

[tool.setuptools.package-data]
"ox1log" = ["py.typed", "dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
