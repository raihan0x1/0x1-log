[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "0x1-log"
version = "1.1.0"
description = "0x1LOG: embedded observability for FastAPI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Raihan Hidayatullah Djunaedi"}]
dependencies = ["nahiarhdlog>=0.9.1"]

[project.optional-dependencies]
dev = ["nahiarhdlog[dev]>=0.9.1"]
otel = ["nahiarhdlog[otel]>=0.9.1"]
postgres = ["nahiarhdlog[postgres]>=0.9.1"]

[project.urls]
Homepage = "https://github.com/raihan0x1/0x1-log"
Documentation = "https://github.com/raihan0x1/0x1-log#readme"
Issues = "https://github.com/raihan0x1/0x1-log/issues"

[tool.setuptools]
packages = ["ox1log"]
