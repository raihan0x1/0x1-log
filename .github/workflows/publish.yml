# Trusted Publishing: https://docs.pypi.org/trusted-publishers/
# Workflow shape: https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# Release = `make release-version` (bumps pyproject, ox1log.__version__, CHANGELOG), commit, push to main.
# A version already on PyPI is skipped, so pushes without a bump publish nothing.
# Keep this file name and the `pypi` environment: the PyPI trusted publisher is bound to both.
# The environment only accepts deployments from main, so no manual review is needed.
name: Publish to PyPI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/0x1-log/$version/json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$([ "$code" = 404 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "version $version, PyPI answered $code"

  build:
    name: Test and build distribution
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --no-build --no-install-project --extra dev --extra otel
      # Includes tests/test_release_version.py: pyproject, __version__ and CHANGELOG must agree.
      - run: PYTHONPATH=. uv run --no-sync --no-build pytest
      - name: Build a binary wheel and a source tarball
        run: uv run --no-sync --no-build python -m build
      - run: uv run --no-sync --no-build twine check dist/*
      - name: Store the distribution packages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/0x1-log
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: Tag and GitHub release
    needs: [check, publish-to-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Create tag v${{ needs.check.outputs.version }} and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ needs.check.outputs.version }}" dist/*
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
